<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCosmos by inMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-hover: #171d2b;
      --border: #1e2638;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #3b82f6;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-text: #f87171;
      
      --tag-happy: #facc15;
      --tag-excited: #fb923c;
      --tag-anxious: #f59e0b;
      --tag-overwhelmed: #ef4444;
      --tag-lost: #8b5cf6;
      --tag-angry: #ec4899;
      --tag-numb: #64748b;
      --tag-hopeful: #10b981;
      --tag-cant-explain: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* -----------------------------------
       Welcome / Auth Screen
       ----------------------------------- */
    #welcomeScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
      background: radial-gradient(circle at center, #11151f 0%, #090b10 100%);
    }

    .auth-card {
      background: rgba(17, 21, 31, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
    }

    .auth-brand-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .auth-brand-title .mind { color: #ffffff; }
    .auth-brand-title .cosmos {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .alert-box {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .auth-inputs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
      text-align: left;
    }

    .auth-inputs label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: -6px;
    }

    .auth-inputs input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .auth-inputs input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .auth-inputs input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-main-auth {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main-auth:hover:not(:disabled) { opacity: 0.9; }
    .btn-main-auth:active:not(:disabled) { transform: scale(0.98); }
    .btn-main-auth:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .btn-google-auth {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, opacity 0.2s;
      margin-bottom: 16px;
    }
    .btn-google-auth:hover:not(:disabled) { opacity: 0.9; }
    .btn-google-auth:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .auth-link:hover { color: var(--text); }

    /* -----------------------------------
       Main Application
       ----------------------------------- */
    #mainApp {
      display: none; 
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 24px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .header-inner {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; flex-direction: column; text-decoration: none; }
    .brand-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-title .mind { color: #ffffff; }
    .brand-title .cosmos { background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .brand-subtitle span { color: #ffffff; font-weight: 600; }

    /* Profile Dropdown */
    .profile-dropdown-container { position: relative; }
    
    .auth-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-badge:hover { border-color: var(--border-focus); color: var(--text); }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 230px;
      z-index: 1000;
      overflow: hidden;
