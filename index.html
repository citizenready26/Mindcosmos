<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCosmos by inMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-hover: #171d2b;
      --border: #1e2638;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #3b82f6;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-text: #f87171;
      
      --tag-happy: #facc15;
      --tag-excited: #fb923c;
      --tag-anxious: #f59e0b;
      --tag-overwhelmed: #ef4444;
      --tag-lost: #8b5cf6;
      --tag-angry: #ec4899;
      --tag-numb: #64748b;
      --tag-hopeful: #10b981;
      --tag-cant-explain: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Welcome / Auth Screen */
    #welcomeScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
      background: radial-gradient(circle at center, #11151f 0%, #090b10 100%);
    }

    .auth-card {
      background: rgba(17, 21, 31, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
    }

    .auth-brand-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .auth-brand-title .mind { color: #ffffff; }
    .auth-brand-title .cosmos {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .alert-box {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .auth-inputs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
      text-align: left;
    }

    .auth-inputs label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: -6px;
    }

    .auth-inputs input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .auth-inputs input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .auth-inputs input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-main-auth {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main-auth:hover:not(:disabled) { opacity: 0.9; }
    .btn-main-auth:active:not(:disabled) { transform: scale(0.98); }
    .btn-main-auth:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .btn-google-auth {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, opacity 0.2s;
      margin-bottom: 16px;
    }
    .btn-google-auth:hover:not(:disabled) { opacity: 0.9; }
    .btn-google-auth:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .auth-link:hover { color: var(--text); }

    /* Main Application */
    #mainApp {
      display: none; 
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 24px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .header-inner {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; flex-direction: column; text-decoration: none; }
    .brand-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-title .mind { color: #ffffff; }
    .brand-title .cosmos { background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .brand-subtitle span { color: #ffffff; font-weight: 600; }

    /* Profile Dropdown Menu */
    .profile-dropdown-container { position: relative; }
    
    .auth-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-badge:hover { border-color: var(--border-focus); color: var(--text); }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 230px;
      z-index: 1000;
      overflow: hidden;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--text);
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: var(--surface-hover); }
    .dropdown-item.member-tier { color: #facc15; font-weight: 600; border-bottom: 1px solid var(--border); }

    .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 24px; transition: border-color 0.2s; }
    .composer:focus-within { border-color: rgba(59, 130, 246, 0.5); }
    .composer textarea { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 0.98rem; line-height: 1.5; resize: none; min-height: 72px; }
    .composer textarea::placeholder { color: var(--text-muted); }
    .composer-footer { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    .picker-wrapper, .filter-wrapper { display: flex; align-items: center; gap: 4px; width: 100%; }
    .filter-wrapper { margin-bottom: 16px; }
    .scroll-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0 4px; display: flex; align-items: center; justify-content: center; transition: color 0.15s; }
    .scroll-btn:hover { color: var(--text); }
    @media (max-width: 600px) { .scroll-btn { display: none; } }
    
    .emotion-picker, .filter-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; flex: 1; padding-bottom: 2px; }
    .emotion-picker::-webkit-scrollbar, .filter-bar::-webkit-scrollbar { display: none; }
    .emotion-radio { display: none; }
    
    .emotion-label { font-size: 0.75rem; font-weight: 500; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .emotion-radio:checked + .emotion-label { background: rgba(255, 255, 255, 0.08); color: var(--text); border-color: var(--text-muted); }

    .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.78rem; font-weight: 500; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; }
    .filter-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .filter-btn.active { background: var(--surface); color: var(--text); border-color: var(--border-focus); }
    .filter-btn.special-filter { border-style: dashed; }

    .btn-post { background: var(--text); color: var(--bg); border: none; font-weight: 600; font-size: 0.82rem; padding: 8px 24px; border-radius: 999px; cursor: pointer; transition: opacity 0.2s; align-self: flex-end; }
    .btn-post:hover:not(:disabled) { opacity: 0.9; }
    .btn-post:disabled { opacity: 0.4; cursor: not-allowed; }

    .feed { display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: background 0.15s, border-color 0.15s; }
    .card:hover { border-color: rgba(255, 255, 255, 0.12); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    
    .badge { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); }
    .badge-happy { color: var(--tag-happy); background: rgba(250, 204, 21, 0.12); }
    .badge-excited { color: var(--tag-excited); background: rgba(251, 146, 60, 0.12); }
    .badge-anxious { color: var(--tag-anxious); background: rgba(245, 158, 11, 0.12); }
    .badge-overwhelmed { color: var(--tag-overwhelmed); background: rgba(239, 68, 68, 0.12); }
    .badge-lost { color: var(--tag-lost); background: rgba(139, 92, 246, 0.12); }
    .badge-angry { color: var(--tag-angry); background: rgba(236, 72, 153, 0.12); }
    .badge-numb { color: var(--tag-numb); background: rgba(100, 116, 139, 0.12); }
    .badge-hopeful { color: var(--tag-hopeful); background: rgba(16, 185, 129, 0.12); }
    .badge-cant-explain { color: var(--tag-unexplainable); background: rgba(56, 189, 248, 0.12); }

    .card-time { font-size: 0.75rem; color: var(--text-muted); }
    .card-question { font-size: 0.96rem; line-height: 1.5; color: var(--text); margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
    .card-actions { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255, 255, 255, 0.04); padding-top: 12px; }
    .btn-toggle-replies { background: transparent; border: none; color: var(--text-muted); font-size: 0.78rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .btn-toggle-replies:hover { color: var(--text); }
    .btn-delete-card { background: transparent; border: none; font-size: 1.05rem; cursor: pointer; opacity: 0.5; transition: opacity 0.15s, transform 0.15s; }
    .btn-delete-card:hover { opacity: 1; transform: scale(1.1); }

    .replies-section { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .replies-section.open { display: block; }
    .replies-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .reply-bubble { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.04); padding: 10px 14px; border-radius: 10px; font-size: 0.86rem; line-height: 1.45; color: #cbd5e1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .reply-content { flex: 1; }
    .reply-time { font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }
    .btn-delete-reply { background: transparent; border: none; font-size: 0.85rem; cursor: pointer; opacity: 0.4; transition: opacity 0.15s; }
    .btn-delete-reply:hover { opacity: 1; }
    
    .reply-input-box { display: flex; gap: 8px; }
    .reply-input-box input { flex: 1; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 0.84rem; outline: none; }
    .reply-input-box input:focus { border-color: var(--border-focus); }
    .btn-submit-reply { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); font-size: 0.78rem; font-weight: 600; padding: 0 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .btn-submit-reply:hover { background: var(--border); }

    .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); font-size: 0.9rem; }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- PayPal SDK (Make sure this is your LIVE Client ID) -->
  <script src="https://www.paypal.com/sdk/js?client-id=BAAYBEl7apEtdKFkGH7pZqmc-q0VNQDSJf5mmABauI9udXXk9bsL53wXw57gOzQgqrza-aMmRVhytP2Ifk&currency=USD"></script>
</head>
<body>

  <!-- ==============================================
       GATEKEEPER: WELCOME & AUTH SCREEN
       ============================================== -->
  <div id="welcomeScreen">
    
    <div class="auth-card">
      <div class="auth-brand-title"><span class="mind">Mind</span><span class="cosmos">Cosmos</span></div>
      
      <div id="authFormArea">
        <p class="auth-subtitle" id="authSubtitle">A safe space to cast your thoughts into the universe. Sign in to continue.</p>

        <div class="alert-box" id="authAlertBox"></div>

        <div class="auth-inputs">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" placeholder="you@example.com">
          
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••">
        </div>

        <button class="btn-main-auth" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>

        <div class="divider">OR</div>

        <button class="btn-google-auth" id="googleAuthBtn" onclick="handleGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-links">
          <button class="auth-link" id="forgotPasswordBtn" onclick="handleForgotPassword()">Forgot password?</button>
          <button class="auth-link" id="authToggleBtn" onclick="toggleAuthMode()">Need an account? <strong>Sign Up</strong></button>
        </div>
      </div>

      <div style="margin-top: 24px; font-size: 0.72rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px; align-items: center; border-top: 1px solid var(--border); padding-top: 16px;">
        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
          <a href="terms.html" style="color: var(--text-muted); text-decoration: none;">Terms & Conditions</a>
          <a href="privacy.html" style="color: var(--text-muted); text-decoration: none;">Privacy Policy</a>
          <a href="refunds.html" style="color: var(--text-muted); text-decoration: none;">Refunds</a>
        </div>
        <span>Support: priyankhudehingia@gmail.com</span>
      </div>
    </div>
  </div>

  <!-- ==============================================
       MAIN APPLICATION (Hidden until authenticated)
       ============================================== -->
  <div id="mainApp">
    
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-title"><span class="mind">Mind</span><span class="cosmos">Cosmos</span></div>
          <div class="brand-subtitle">by <span>inMind</span></div>
        </div>
        
        <div class="profile-dropdown-container">
          <div class="auth-badge" onclick="toggleProfileDropdown()" id="authBadgeText">
            <span>👤 Account</span>
          </div>
          <div class="dropdown-menu" id="profileDropdown">
            <button class="dropdown-item member-tier" onclick="handleBecomeMember()">⭐ Become a Member</button>
            <button class="dropdown-item" onclick="handleSignOut()">🚪 Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="app-container">
      
      <!-- New Minimal, Price-Free Banner -->
      <div id="premiumAdBanner" style="display: none; background: linear-gradient(145deg, rgba(250, 204, 21, 0.1) 0%, rgba(245, 158, 11, 0.02) 100%); border: 1px solid rgba(250, 204, 21, 0.3); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
        <div>
          <h3 style="color: #facc15; font-size: 0.95rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">⭐ Get the Golden Star</h3>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Priority ranking & exclusive badge.</p>
        </div>
        <button onclick="handleBecomeMember()" style="background: #facc15; color: #000; border: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: transform 0.2s;">
          Become a Member
        </button>
      </div>

      <div class="composer">
        <textarea id="questionInput" placeholder="What thought or feeling is in your mind right now?" maxlength="320"></textarea>
        <div class="composer-footer">
          <div class="picker-wrapper">
            <button class="scroll-btn" onclick="scrollPicker(-150)" title="Scroll Left">&#10094;</button>
            <div class="emotion-picker" id="emotionPicker">
              <label><input type="radio" name="emotion" value="Happy" class="emotion-radio" checked><span class="emotion-label">Happy</span></label>
              <label><input type="radio" name="emotion" value="Excited" class="emotion-radio"><span class="emotion-label">Excited</span></label>
              <label><input type="radio" name="emotion" value="Anxious" class="emotion-radio"><span class="emotion-label">Anxious</span></label>
              <label><input type="radio" name="emotion" value="Overwhelmed" class="emotion-radio"><span class="emotion-label">Overwhelmed</span></label>
              <label><input type="radio" name="emotion" value="Lost" class="emotion-radio"><span class="emotion-label">Lost</span></label>
              <label><input type="radio" name="emotion" value="Angry" class="emotion-radio"><span class="emotion-label">Angry</span></label>
              <label><input type="radio" name="emotion" value="Numb" class="emotion-radio"><span class="emotion-label">Numb</span></label>
              <label><input type="radio" name="emotion" value="Hopeful" class="emotion-radio"><span class="emotion-label">Hopeful</span></label>
              <label><input type="radio" name="emotion" value="Can't Explain" class="emotion-radio"><span class="emotion-label">I can't explain</span></label>
            </div>
            <button class="scroll-btn" onclick="scrollPicker(150)" title="Scroll Right">&#10095;</button>
          </div>
          <button class="btn-post" id="postBtn" onclick="handlePostQuestion()">Release</button>
        </div>
      </div>

      <div class="filter-wrapper">
        <button class="scroll-btn" onclick="scrollFilters(-150)" title="Scroll Left">&#10094;</button>

      const menu = document.getElementById('profileDropdown');
      menu.classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest('.profile-dropdown-container')) {
        document.getElementById('profileDropdown')?.classList.remove('show');
      }
    });

    async function checkUserMembership(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists && doc.data().isMember) {
          userMembershipsCache[uid] = true;

          const memberBtn = document.querySelector('.member-tier');
          if (memberBtn) {
            memberBtn.innerHTML = '⭐ Golden Member Active';
            memberBtn.onclick = null;
            memberBtn.style.cursor = 'default';
          }
          
          const adBanner = document.getElementById('premiumAdBanner');
          if (adBanner) adBanner.style.display = 'none';

        } else {
          userMembershipsCache[uid] = false;
          const adBanner = document.getElementById('premiumAdBanner');
          if (adBanner) adBanner.style.display = 'flex';
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function submitUtr() {
      const utr = document.getElementById('upiUtr').value.trim();
      if (!utr || utr.length < 8) {
        alert("Please enter a valid Transaction ID / UTR.");
        return;
      }
      
      try {
        await db.collection('pending_upgrades').add({
          userId: currentUserId,
          email: currentUserEmailPrefix,
          utr: utr,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Verification pending. Your star will appear shortly after we confirm the UTR.');
        document.getElementById('paymentModal').remove();
      } catch(err) {

    }
