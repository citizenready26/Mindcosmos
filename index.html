<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCosmos by inMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-hover: #171d2b;
      --border: #1e2638;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #3b82f6;
      
      --tag-anxious: #f59e0b;
      --tag-overwhelmed: #ef4444;
      --tag-lost: #8b5cf6;
      --tag-angry: #ec4899;
      --tag-numb: #64748b;
      --tag-hopeful: #10b981;
      --tag-unexplainable: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 24px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .header-inner {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-title .mind {
      color: #ffffff;
    }

    .brand-title .cosmos {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    
    .brand-subtitle span {
      color: #ffffff;
      font-weight: 600;
    }

    .sync-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sync-badge:hover {
      border-color: var(--border-focus);
      color: var(--text);
    }

    /* Composer Box */
    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }

    .composer:focus-within {
      border-color: rgba(59, 130, 246, 0.5);
    }

    .composer textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.5;
      resize: none;
      min-height: 72px;
    }

    .composer textarea::placeholder {
      color: var(--text-muted);
    }

    .composer-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Make emotions in the composer a neat, scrollable single line */
    .emotion-picker {
      display: flex;
      flex-wrap: nowrap; 
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    
    .emotion-picker::-webkit-scrollbar {
      display: none;
    }

    .emotion-radio {
      display: none;
    }

    .emotion-label {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .emotion-radio:checked + .emotion-label {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-post {
      background: var(--text);
      color: var(--bg);
      border: none;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 8px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: flex-end;
    }

    .btn-post:hover {
      opacity: 0.9;
    }

    .btn-post:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Emotion Filter Bar with Arrows */
    .filter-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      margin-bottom: 16px;
    }

    .scroll-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .scroll-btn:hover {
      color: var(--text);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-behavior: smooth;
      flex: 1;
      padding-bottom: 2px;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .filter-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-focus);
    }

    .filter-btn.special-filter {
      border-style: dashed;
    }

    /* Feed & Cards */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      transition: background 0.15s, border-color 0.15s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    .badge-anxious { color: var(--tag-anxious); background: rgba(245, 158, 11, 0.12); }
    .badge-overwhelmed { color: var(--tag-overwhelmed); background: rgba(239, 68, 68, 0.12); }
    .badge-lost { color: var(--tag-lost); background: rgba(139, 92, 246, 0.12); }
    .badge-angry { color: var(--tag-angry); background: rgba(236, 72, 153, 0.12); }
    .badge-numb { color: var(--tag-numb); background: rgba(100, 116, 139, 0.12); }
    .badge-hopeful { color: var(--tag-hopeful); background: rgba(16, 185, 129, 0.12); }
    .badge-cant-explain { color: var(--tag-unexplainable); background: rgba(56, 189, 248, 0.12); }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-question {
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 12px;
    }

    .btn-toggle-replies {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .btn-toggle-replies:hover {
      color: var(--text);
    }

    .btn-delete-card {
      background: transparent;
      border: none;
      font-size: 1.05rem;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-delete-card:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Accordion Replies */
    .replies-section {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .replies-section.open {
      display: block;
    }

    .replies-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .reply-bubble {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.45;
      color: #cbd5e1;
    }

    .reply-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .reply-input-box {
      display: flex;
      gap: 8px;
    }

    .reply-input-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    .reply-input-box input:focus {
      border-color: var(--border-focus);
    }

    .btn-submit-reply {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-submit-reply:hover {
      background: var(--border);
    }

    /* Modal for Sync Key */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .modal p {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .sync-key-display {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--accent);
      user-select: all;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-inputs input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-restore {
      background: var(--accent);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    /* Hide scroll arrows on mobile screens */
    @media (max-width: 600px) {
      .scroll-btn {
        display: none;
      }
    }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-inner">
      <a href="#" class="brand">
        <div class="brand-title"><span class="mind">Mind</span><span class="cosmos">Cosmos</span></div>
        <div class="brand-subtitle">by <span>inMind</span></div>
      </a>
      <div class="sync-badge" onclick="openSyncModal()">
        <span>🔑 Sync Key</span>
      </div>
    </div>
  </header>

  <div class="app-container">

    <!-- Composer -->
    <div class="composer">
      <textarea id="questionInput" placeholder="What thought or feeling is in your mind right now?" maxlength="320"></textarea>
      <div class="composer-footer">
        <div class="emotion-picker">
          <label><input type="radio" name="emotion" value="Anxious" class="emotion-radio" checked><span class="emotion-label">Anxious</span></label>
          <label><input type="radio" name="emotion" value="Overwhelmed" class="emotion-radio"><span class="emotion-label">Overwhelmed</span></label>
          <label><input type="radio" name="emotion" value="Lost" class="emotion-radio"><span class="emotion-label">Lost</span></label>
          <label><input type="radio" name="emotion" value="Angry" class="emotion-radio"><span class="emotion-label">Angry</span></label>
          <label><input type="radio" name="emotion" value="Numb" class="emotion-radio"><span class="emotion-label">Numb</span></label>
          <label><input type="radio" name="emotion" value="Hopeful" class="emotion-radio"><span class="emotion-label">Hopeful</span></label>
          <label><input type="radio" name="emotion" value="Can't Explain" class="emotion-radio"><span class="emotion-label">I can't explain</span></label>
        </div>
        <button class="btn-post" id="postBtn" onclick="handlePostQuestion()">Release</button>
      </div>
    </div>

    <!-- Emotion Filter Bar with Arrows -->
    <div class="filter-wrapper">
      <button class="scroll-btn" onclick="scrollFilters(-150)" title="Scroll Left">&#10094;</button>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" onclick="setFilter('All', this)">All Feeds</button>
        <button class="filter-btn special-filter" onclick="setFilter('MyFeed', this)">My feed</button>
        <button class="filter-btn" onclick="setFilter('Anxious', this)">Anxious</button>
        <button class="filter-btn" onclick="setFilter('Overwhelmed', this)">Overwhelmed</button>
        <button class="filter-btn" onclick="setFilter('Lost', this)">Lost</button>
        <button class="filter-btn" onclick="setFilter('Angry', this)">Angry</button>
        <button class="filter-btn" onclick="setFilter('Numb', this)">Numb</button>
        <button class="filter-btn" onclick="setFilter('Hopeful', this)">Hopeful</button>
        <button class="filter-btn" onclick="setFilter('Can\'t Explain', this)">I can't explain</button>
      </div>
      <button class="scroll-btn" onclick="scrollFilters(150)" title="Scroll Right">&#10095;</button>
    </div>

    <!-- Feed Container -->
    <div class="feed" id="feedContainer">
      <div class="empty-state">Loading thoughts...</div>
    </div>

  </div>

  <!-- Sync Key Modal -->
  <div class="modal-backdrop" id="syncModal">
    <div class="modal">
      <h3>Invisible Identity</h3>
      <p>Your session is stored locally. Save this 3-word Sync Key to access your question history on any other browser or device.</p>
      
      <div class="sync-key-display" id="syncKeyDisplay">...</div>

      <div class="modal-inputs">
        <label style="font-size:0.75rem; color:var(--text-muted)">Have an existing Sync Key?</label>
        <input type="text" id="restoreKeyInput" placeholder="word-word-word">
      </div>

      <div class="modal-actions">
        <button class="btn-close" onclick="closeSyncModal()">Close</button>
        <button class="btn-restore" onclick="handleRestoreKey()">Restore Mind</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyC_jtZZWz6h9qMAZa7nsNX-pdzt6qjyIno",
      authDomain: "inmind-8e8fb.firebaseapp.com",
      projectId: "inmind-8e8fb",
      storageBucket: "inmind-8e8fb.firebasestorage.app",
      messagingSenderId: "814260883254",
      appId: "1:814260883254:web:a3eddb71cd14bcda322d97",
      measurementId: "G-XREGV1P1YE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Horizontal Scroll Function
    function scrollFilters(amount) {
      document.getElementById('filterBar').scrollBy({ left: amount, behavior: 'smooth' });
    }

    // 2. Invisible Auth & Sync Key Generation
    const WORD_LIST = ["silent", "orbit", "cloud", "shadow", "spark", "echo", "harbor", "drift", "pulse", "depth", "light", "river"];

    function generateSyncKey() {
      const p1 = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
      const p2 = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
      const p3 = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
      return `${p1}-${p2}-${p3}`;
    }

    let currentUserId = localStorage.getItem('inmind_uid');
    let currentSyncKey = localStorage.getItem('inmind_sync_key');

    if (!currentUserId || !currentSyncKey) {
      currentUserId = 'usr_' + Math.random().toString(36).substring(2, 10);
      currentSyncKey = generateSyncKey();
      localStorage.setItem('inmind_uid', currentUserId);
      localStorage.setItem('inmind_sync_key', currentSyncKey);
    }

    document.getElementById('syncKeyDisplay').innerText = currentSyncKey;

    // 3. State & Filtering
    let currentFilter = 'All';
    let unsubscribeFeed = null;

    function setFilter(filterType, element) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      
      if (lastSnapshot) renderFeed(lastSnapshot);
    }

    function timeAgo(date) {
      if (!date) return 'just now';
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return `${Math.max(1, seconds)}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    // 4. Real-time Feed Listener
    let lastSnapshot = null;

    function listenToFeed() {
      const feedContainer = document.getElementById('feedContainer');
      
      unsubscribeFeed = db.collection('questions')
        .orderBy('createdAt', 'desc')
        .limit(100)
        .onSnapshot(snapshot => {
          lastSnapshot = snapshot;
          renderFeed(snapshot);
        }, err => {
          console.error("Firestore feed error:", err);
          feedContainer.innerHTML = `<div class="empty-state">Unable to load feed. Check Firestore Security Rules.</div>`;
        });
    }

    function renderFeed(snapshot) {
      const feedContainer = document.getElementById('feedContainer');
      feedContainer.innerHTML = '';
      let visibleCount = 0;

      snapshot.forEach(doc => {
        const item = doc.data();
        
        if (currentFilter === 'MyFeed' && item.authorId !== currentUserId) return;
        if (currentFilter !== 'All' && currentFilter !== 'MyFeed' && item.emotion !== currentFilter) return;

        visibleCount++;
        const card = createCardElement(doc.id, item);
        feedContainer.appendChild(card);
      });

      if (visibleCount === 0) {
        feedContainer.innerHTML = `<div class="empty-state">${currentFilter === 'MyFeed' ? "You haven't released any thoughts yet." : "No thoughts found in this space yet."}</div>`;
      }
    }

    // 5. Card UI Rendering & Accordion Replies
    function createCardElement(id, data) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${id}`;

      const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
      const rawEmotion = data.emotion || 'lost';
      const emotionClass = `badge-${rawEmotion.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
      const isOwner = data.authorId === currentUserId;

      card.innerHTML = `
        <div class="card-header">
          <span class="badge ${emotionClass}">${escapeHtml(data.emotion || 'Thought')}</span>
          <span class="card-time">${timeAgo(dateObj)}</span>
        </div>
        <div class="card-question">${escapeHtml(data.text)}</div>
        <div class="card-actions">
          <button class="btn-toggle-replies" onclick="toggleReplies('${id}')">
            💬 <span id="reply-count-${id}">${data.replyCount || 0}</span> answers
          </button>
          ${isOwner ? `<button class="btn-delete-card" onclick="handleDeleteQuestion('${id}')" title="Delete thought">🗑️</button>` : ''}
        </div>
        <div class="replies-section" id="replies-${id}">
          <div class="replies-list" id="replies-list-${id}">
            <div style="font-size:0.75rem; color:var(--text-muted);">Loading answers...</div>
          </div>
          <div class="reply-input-box">
            <input type="text" id="input-${id}" placeholder="Provide clarity or comfort..." maxlength="200" onkeydown="if(event.key==='Enter') submitReply('${id}')">
            <button class="btn-submit-reply" onclick="submitReply('${id}')">Answer</button>
          </div>
        </div>
      `;
      return card;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 6. Delete Question Handler
    async function handleDeleteQuestion(qId) {
      if (!confirm("Are you sure you want to permanently delete this thought?")) return;

      try {
        await db.collection('questions').doc(qId).delete();
      } catch (err) {
        console.error("Error deleting post:", err);
        alert("Failed to delete. Make sure delete permissions are enabled in Firebase rules.");
      }
    }

    // 7. Reply Toggle & Subcollection Loader
    const activeReplyListeners = {};

    function toggleReplies(qId) {
      const section = document.getElementById(`replies-${qId}`);
      const isOpen = section.classList.contains('open');

      if (isOpen) {
        section.classList.remove('open');
        if (activeReplyListeners[qId]) {
          activeReplyListeners[qId]();
          delete activeReplyListeners[qId];
        }
      } else {
        section.classList.add('open');
        loadReplies(qId);
      }
    }

    function loadReplies(qId) {
      const listContainer = document.getElementById(`replies-list-${qId}`);
      
      activeReplyListeners[qId] = db.collection('questions').doc(qId).collection('answers')
        .orderBy('createdAt', 'asc')
        .onSnapshot(snap => {
          if (snap.empty) {
            listContainer.innerHTML = `<div style="font-size:0.75rem; color:var(--text-muted);">No answers yet. Be the first to reply.</div>`;
            return;
          }
          listContainer.innerHTML = '';
          snap.forEach(doc => {
            const reply = doc.data();
            const dateObj = reply.createdAt ? reply.createdAt.toDate() : new Date();
            const replyEl = document.createElement('div');
            replyEl.className = 'reply-bubble';
            replyEl.innerHTML = `
              <div>${escapeHtml(reply.text)}</div>
              <div class="reply-time">${timeAgo(dateObj)}</div>
            `;
            listContainer.appendChild(replyEl);
          });
        });
    }

    // 8. Post Question
    async function handlePostQuestion() {
      const input = document.getElementById('questionInput');
      const text = input.value.trim();
      const emotionRadio = document.querySelector('input[name="emotion"]:checked');
      const emotion = emotionRadio ? emotionRadio.value : 'Anxious';
      const postBtn = document.getElementById('postBtn');

      if (!text) return;

      postBtn.disabled = true;
      postBtn.innerText = 'Releasing...';

      try {
        await db.collection('questions').add({
          text: text,
          emotion: emotion,
          authorId: currentUserId,
          replyCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        input.value = '';
      } catch (err) {
        console.error("Error creating post:", err);
        alert("Failed to submit. Please check Firestore Rules.");
      } finally {
        postBtn.disabled = false;
        postBtn.innerText = 'Release';
      }
    }

    // 9. Submit Reply
    async function submitReply(qId) {
      const input = document.getElementById(`input-${qId}`);
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      try {
        const qRef = db.collection('questions').doc(qId);
        
        await qRef.collection('answers').add({
          text: text,
          authorId: currentUserId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await qRef.update({
          replyCount: firebase.firestore.FieldValue.increment(1)
        });
      } catch (err) {
        console.error("Error submitting answer:", err);
      }
    }

    // 10. Sync Key Modal Functions
    function openSyncModal() {
      document.getElementById('syncModal').classList.add('open');
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.remove('open');
    }

    function handleRestoreKey() {
      const key = document.getElementById('restoreKeyInput').value.trim();
      if (!key) return;
      
      localStorage.setItem('inmind_sync_key', key);
      localStorage.setItem('inmind_uid', 'usr_' + btoa(key).replace(/=/g, '').toLowerCase());
      
      currentUserId = localStorage.getItem('inmind_uid');
      currentSyncKey = key;
      document.getElementById('syncKeyDisplay').innerText = key;
      closeSyncModal();
      
      if (lastSnapshot) renderFeed(lastSnapshot);
    }

    // Initial Load
    listenToFeed();
  </script>
</body>
</html>
