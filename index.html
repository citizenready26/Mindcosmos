<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCosmos by inMind</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XREGV1P1YE"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-hover: #171d2b;
      --border: #1e2638;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #3b82f6;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-text: #f87171;
      
      --tag-happy: #facc15;
      --tag-excited: #fb923c;
      --tag-anxious: #f59e0b;
      --tag-overwhelmed: #ef4444;
      --tag-lost: #8b5cf6;
      --tag-angry: #ec4899;
      --tag-numb: #64748b;
      --tag-hopeful: #10b981;
      --tag-cant-explain: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #mainApp {
      display: flex; 
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 24px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .header-inner {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; flex-direction: column; text-decoration: none; }
    .brand-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-title .mind { color: #ffffff; }
    .brand-title .cosmos { background: linear-gradient(180deg, #60a5fa 0%, #2563eb 50%, #1e3a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .brand-subtitle span { color: #ffffff; font-weight: 600; }

    .profile-dropdown-container { position: relative; }
    
    .auth-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-badge:hover { border-color: var(--border-focus); color: var(--text); }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 230px;
      z-index: 1000;
      overflow: hidden;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--text);
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: var(--surface-hover); }
    .dropdown-item.member-tier { color: #facc15; font-weight: 600; border-bottom: 1px solid var(--border); }

    .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 24px; transition: border-color 0.2s; }
    .composer:focus-within { border-color: rgba(59, 130, 246, 0.5); }
    .composer textarea { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 0.98rem; line-height: 1.5; resize: none; min-height: 72px; }
    .composer textarea::placeholder { color: var(--text-muted); }
    .composer-footer { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    .picker-wrapper, .filter-wrapper { display: flex; align-items: center; gap: 4px; width: 100%; }
    .filter-wrapper { margin-bottom: 16px; }
    .scroll-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0 4px; display: flex; align-items: center; justify-content: center; transition: color 0.15s; }
    .scroll-btn:hover { color: var(--text); }
    @media (max-width: 600px) { .scroll-btn { display: none; } }
    
    .emotion-picker, .filter-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; flex: 1; padding-bottom: 2px; }
    .emotion-picker::-webkit-scrollbar, .filter-bar::-webkit-scrollbar { display: none; }
    .emotion-radio { display: none; }
    
    .emotion-label { font-size: 0.75rem; font-weight: 500; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .emotion-radio:checked + .emotion-label { background: rgba(255, 255, 255, 0.08); color: var(--text); border-color: var(--text-muted); }

    .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.78rem; font-weight: 500; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; }
    .filter-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .filter-btn.active { background: var(--surface); color: var(--text); border-color: var(--border-focus); }
    .filter-btn.special-filter { border-style: dashed; }

    .btn-post { background: var(--text); color: var(--bg); border: none; font-weight: 600; font-size: 0.82rem; padding: 8px 24px; border-radius: 999px; cursor: pointer; transition: opacity 0.2s; align-self: flex-end; }
    .btn-post:hover:not(:disabled) { opacity: 0.9; }
    .btn-post:disabled { opacity: 0.4; cursor: not-allowed; }

    .feed { display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: background 0.15s, border-color 0.15s; }
    .card:hover { border-color: rgba(255, 255, 255, 0.12); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    
    .badge { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); }
    .badge-happy { color: var(--tag-happy); background: rgba(250, 204, 21, 0.12); }
    .badge-excited { color: var(--tag-excited); background: rgba(251, 146, 60, 0.12); }
    .badge-anxious { color: var(--tag-anxious); background: rgba(245, 158, 11, 0.12); }
    .badge-overwhelmed { color: var(--tag-overwhelmed); background: rgba(239, 68, 68, 0.12); }
    .badge-lost { color: var(--tag-lost); background: rgba(139, 92, 246, 0.12); }
    .badge-angry { color: var(--tag-angry); background: rgba(236, 72, 153, 0.12); }
    .badge-numb { color: var(--tag-numb); background: rgba(100, 116, 139, 0.12); }
    .badge-hopeful { color: var(--tag-hopeful); background: rgba(16, 185, 129, 0.12); }
    .badge-cant-explain { color: var(--tag-cant-explain); background: rgba(56, 189, 248, 0.12); }

    .card-time { font-size: 0.75rem; color: var(--text-muted); }
    .card-question { font-size: 0.96rem; line-height: 1.5; color: var(--text); margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
    .card-actions { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255, 255, 255, 0.04); padding-top: 12px; }
    .btn-toggle-replies { background: transparent; border: none; color: var(--text-muted); font-size: 0.78rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .btn-toggle-replies:hover { color: var(--text); }
    .btn-delete-card { background: transparent; border: none; font-size: 1.05rem; cursor: pointer; opacity: 0.5; transition: opacity 0.15s, transform 0.15s; }
    .btn-delete-card:hover { opacity: 1; transform: scale(1.1); }

    .replies-section { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .replies-section.open { display: block; }
    .replies-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .reply-bubble { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.04); padding: 10px 14px; border-radius: 10px; font-size: 0.86rem; line-height: 1.45; color: #cbd5e1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .reply-content { flex: 1; }
    .reply-time { font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }
    .btn-delete-reply { background: transparent; border: none; font-size: 0.85rem; cursor: pointer; opacity: 0.4; transition: opacity 0.15s; }
    .btn-delete-reply:hover { opacity: 1; }
    
    .reply-input-box { display: flex; gap: 8px; }
    .reply-input-box input { flex: 1; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 0.84rem; outline: none; }
    .reply-input-box input:focus { border-color: var(--border-focus); }
    .btn-submit-reply { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); font-size: 0.78rem; font-weight: 600; padding: 0 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .btn-submit-reply:hover { background: var(--border); }

    .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); font-size: 0.9rem; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="mainApp">
    
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-title"><span class="mind">Mind</span><span class="cosmos">Cosmos</span></div>
          <div class="brand-subtitle">by <span>inMind</span></div>
        </div>
        
        <div class="profile-dropdown-container">
          <div class="auth-badge" onclick="toggleProfileDropdown()" id="authBadgeText">
            <span>👤 Connecting...</span>
          </div>
          <div class="dropdown-menu" id="profileDropdown">
            <button class="dropdown-item member-tier" onclick="handleBecomeMember()">⭐ Become a Member</button>
          </div>
        </div>
      </div>
    </header>

    <div class="app-container">
      
      <div id="premiumAdBanner" style="display: none; background: linear-gradient(145deg, rgba(250, 204, 21, 0.1) 0%, rgba(245, 158, 11, 0.02) 100%); border: 1px solid rgba(250, 204, 21, 0.3); border-radius: 16px; padding: 14px 18px; margin-bottom: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
        <div>
          <h3 style="color: #facc15; font-size: 0.95rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">⭐ Get the Golden Star</h3>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Priority ranking & exclusive badge.</p>
        </div>
        <button onclick="handleBecomeMember()" style="background: #facc15; color: #000; border: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap;">
          Become a Member
        </button>
      </div>

      <div class="composer">
        <textarea id="questionInput" placeholder="What thought or feeling is in your mind right now?" maxlength="320"></textarea>
        <div class="composer-footer">
          <div class="picker-wrapper">
            <button class="scroll-btn" onclick="scrollPicker(-150)" title="Scroll Left">&#10094;</button>
            <div class="emotion-picker" id="emotionPicker">
              <label><input type="radio" name="emotion" value="Happy" class="emotion-radio" checked><span class="emotion-label">Happy</span></label>
              <label><input type="radio" name="emotion" value="Excited" class="emotion-radio"><span class="emotion-label">Excited</span></label>
              <label><input type="radio" name="emotion" value="Anxious" class="emotion-radio"><span class="emotion-label">Anxious</span></label>
              <label><input type="radio" name="emotion" value="Overwhelmed" class="emotion-radio"><span class="emotion-label">Overwhelmed</span></label>
              <label><input type="radio" name="emotion" value="Lost" class="emotion-radio"><span class="emotion-label">Lost</span></label>
              <label><input type="radio" name="emotion" value="Angry" class="emotion-radio"><span class="emotion-label">Angry</span></label>
              <label><input type="radio" name="emotion" value="Numb" class="emotion-radio"><span class="emotion-label">Numb</span></label>
              <label><input type="radio" name="emotion" value="Hopeful" class="emotion-radio"><span class="emotion-label">Hopeful</span></label>
              <label><input type="radio" name="emotion" value="Can't Explain" class="emotion-radio"><span class="emotion-label">I can't explain</span></label>
            </div>
            <button class="scroll-btn" onclick="scrollPicker(150)" title="Scroll Right">&#10095;</button>
          </div>
          <button class="btn-post" id="postBtn" onclick="handlePostQuestion()">Release</button>
        </div>
      </div>

      <div class="filter-wrapper">
        <button class="scroll-btn" onclick="scrollFilters(-150)" title="Scroll Left">&#10094;</button>
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" onclick="setFilter('All', this)">All Feeds</button>
          <button class="filter-btn special-filter" onclick="setFilter('MyFeed', this)">My feed</button>
          <button class="filter-btn" onclick="setFilter('Happy', this)">Happy</button>
          <button class="filter-btn" onclick="setFilter('Excited', this)">Excited</button>
          <button class="filter-btn" onclick="setFilter('Anxious', this)">Anxious</button>
          <button class="filter-btn" onclick="setFilter('Overwhelmed', this)">Overwhelmed</button>
          <button class="filter-btn" onclick="setFilter('Lost', this)">Lost</button>
          <button class="filter-btn" onclick="setFilter('Angry', this)">Angry</button>
          <button class="filter-btn" onclick="setFilter('Numb', this)">Numb</button>
          <button class="filter-btn" onclick="setFilter('Hopeful', this)">Hopeful</button>
          <button class="filter-btn" onclick="setFilter('Can\'t Explain', this)">I can't explain</button>
        </div>
        <button class="scroll-btn" onclick="scrollFilters(150)" title="Scroll Right">&#10095;</button>
      </div>

      <div class="feed" id="feedContainer">
        <div class="empty-state">Connecting to the cosmos...</div>
      </div>
    </div>
  </div>

  <script>
    let currentUserId = null;
    let userMembershipsCache = {};
    let currentFilter = 'All';
    let allQuestionsCache = [];
    let userInteractedQuestionIds = new Set();
    let unsubscribeFeed = null;
    let activeReplyListeners = {};

    const firebaseConfig = {
      apiKey: "AIzaSyC_jtZZWz6h9qMAZa7nsNX-pdzt6qjyIno",
      authDomain: "inmind-8e8fb.firebaseapp.com",
      projectId: "inmind-8e8fb",
      storageBucket: "inmind-8e8fb.firebasestorage.app",
      messagingSenderId: "814260883254",
      appId: "1:814260883254:web:a3eddb71cd14bcda322d97",
      measurementId: "G-XREGV1P1YE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // FIXED: Properly handle the incognito silent-failure
    auth.onAuthStateChanged(async user => {
      if (user) { 
        currentUserId = user.uid;
        
        // Show visually that they successfully connected
        const badge = document.getElementById('authBadgeText');
        if (badge) badge.innerHTML = `<span>👤 Guest ${user.uid.substring(0,4)}</span>`;
        
        checkUserMembership(currentUserId);
        listenToFeed(); 
      } else {
        auth.signInAnonymously().catch(err => {
          console.error("Anonymous auth failed:", err);
          const feed = document.getElementById('feedContainer');
          if (feed) feed.innerHTML = `<div class="empty-state" style="color: #f87171;">Failed to connect. If you are in Incognito mode, your browser is blocking the anonymous session. Please try a normal window!</div>`;
        });
      }
    });

    function toggleProfileDropdown() {
      const menu = document.getElementById('profileDropdown');
      if (menu) menu.classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest('.profile-dropdown-container')) {
        const menu = document.getElementById('profileDropdown');
        if (menu) menu.classList.remove('show');
      }
    });

    function checkUserMembership(uid) {
      db.collection('users').doc(uid).onSnapshot(doc => {
        const data = doc.exists ? doc.data() : null;
        const isMember = data && (data.isMember === true || data.isMember === "true");

        userMembershipsCache[uid] = isMember;

        const memberBtn = document.querySelector('.member-tier');
        const adBanner = document.getElementById('premiumAdBanner');

        if (isMember) {
          if (memberBtn) {
            memberBtn.innerHTML = '⭐ Golden Member Active';
            memberBtn.onclick = null;
            memberBtn.style.cursor = 'default';
          }
          if (adBanner) adBanner.style.display = 'none';
        } else {
          if (adBanner) adBanner.style.display = 'flex';
        }

        renderFeed();
      }, err => {
        console.error("Membership check error:", err);
      });
    }

    async function submitUtr() {
      const utrBtn = document.querySelector('button[onclick="submitUtr()"]');
      const utr = document.getElementById('upiUtr').value.trim();
      
      if (!utr || utr.length < 8) {
        alert("Please enter a valid Transaction ID / UTR.");
        return;
      }
      
      if (utrBtn) {
        utrBtn.innerText = "Submitting...";
        utrBtn.disabled = true;
      }
      
      try {
        await db.collection('pending_upgrades').add({
          userId: currentUserId,
          email: 'Anonymous Guest',
          utr: utr,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        const modalContainer = document.querySelector('#paymentModal > div');
        if (modalContainer) {
          modalContainer.innerHTML = `
            <div style="text-align: center; padding: 24px 8px;">
              <div style="font-size: 3.5rem; margin-bottom: 16px;">⏳</div>
              <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; color: var(--text);">Upgrade Pending</h2>
              <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px;">
                Your UTR has been securely received.<br><br>
                Our team will verify the transaction and activate your <strong>Golden Star</strong> within 24 hours.
              </p>
              <button onclick="document.getElementById('paymentModal').remove()" style="width: 100%; background: var(--text); color: var(--bg); border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">
                Return to Cosmos
              </button>
            </div>
          `;
        }
      } catch(err) {
        console.error(err);
        alert('Error submitting UTR. Please try again.');
        if (utrBtn) {
          utrBtn.innerText = "Submit UTR for Verification";
          utrBtn.disabled = false;
        }
      }
    }

    const CLIENT_ID = "BAAPBgAGV8ceqij394Pt0XfiVa-zdzpjxmA0laDfJ1tIB9ZjRvosuE-Xpenpecy1Re5MOCGFtAQcNFWoRc";

    function handleBecomeMember() {
      const existingMenu = document.getElementById('profileDropdown');
      if (existingMenu) existingMenu.classList.remove('show');
      
      const existingModal = document.getElementById('paymentModal');
      if (existingModal) existingModal.remove();

      const modalHtml = `
        <div id="paymentModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9, 11, 16, 0.85); backdrop-filter: blur(6px); z-index:2000; display:flex; align-items:center; justify-content:center;">
          <div style="background:var(--surface); padding:32px 24px; border-radius:24px; border:1px solid var(--border); width:90%; max-width:400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto;">
            
            <div style="text-align: center; margin-bottom: 24px;">
              <div style="font-size: 2.8rem; margin-bottom: 8px; line-height: 1;">⭐</div>
              <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; color: var(--text);">Golden Membership</h2>
              <p style="font-size: 0.85rem; color: var(--text-muted);">Stand out in the cosmos and support the universe.</p>
            </div>

            <div style="background: rgba(0,0,0,0.25); border-radius: 16px; padding: 16px; margin-bottom: 24px;">
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                <span style="font-size: 1.1rem;">✨</span>
                <span style="font-size: 0.88rem; color: var(--text);">Exclusive <strong>Golden Star</strong> badge</span>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                <span style="font-size: 1.1rem;">🚀</span>
                <span style="font-size: 0.88rem; color: var(--text);"><strong>Priority ranking</strong> in the global feed</span>
              </div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 1.1rem;">💖</span>
                <span style="font-size: 0.88rem; color: var(--text);">Support platform development</span>
              </div>
            </div>

            <div style="margin-bottom: 10px; text-align: center;">
              <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">FOR INTERNATIONAL USERS ($1.00)</span>
            </div>
            
            <div id="paypal-button-container" style="margin-bottom: 24px; min-height: 45px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 8px;">
               <span style="font-size: 0.85rem; color: var(--text-muted);">Loading secure checkout...</span>
            </div>

            <div style="margin-bottom: 10px; text-align: center;">
              <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">FOR INDIAN USERS (₹89 VIA UPI)</span>
            </div>
            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px; text-align: center; border: 1px solid var(--border);">
              <a href="upi://pay?pa=priyankhudehingia@oksbi&pn=MindCosmos&am=89.00&cu=INR&tn=GoldenStar" 
                 style="display: block; background: #10b981; color: #000; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">
                📲 Tap to Pay via UPI App
              </a>
              <img src="qr.jpeg" style="width: 130px; height: 130px; border-radius: 8px; margin-bottom: 8px; border: 2px solid #fff; object-fit: cover;" alt="UPI QR">
              <p style="font-size: 0.8rem; color: #3b82f6; margin-bottom: 16px; font-weight: 600;">priyankhudehingia@oksbi</p>
              <input type="text" id="upiUtr" placeholder="Enter 12-digit UTR No." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #000; color: #fff; margin-bottom: 12px; text-align: center; font-size: 0.9rem;">
              <button onclick="submitUtr()" style="width: 100%; background: var(--text); color: var(--bg); border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;">
                Submit UTR for Verification
              </button>
            </div>

            <button onclick="document.getElementById('paymentModal').remove()" style="margin-top:20px; width: 100%; background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size: 0.88rem; padding: 8px;">Maybe Later</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      const paypalContainer = document.getElementById('paypal-button-container');

      function renderPayPalButtons() {
        paypalContainer.innerHTML = ''; 
        try {
          paypal.Buttons({
            style: { layout: 'horizontal', color: 'gold', shape: 'rect', label: 'paypal', height: 45 },
            createOrder: function(data, actions) {
              return actions.order.create({
                purchase_units: [{ amount: { value: '1.00' }, description: 'MindCosmos Golden Membership', custom_id: currentUserId }]
              });
            },
            onApprove: function(data, actions) {
              return actions.order.capture().then(async function(details) {
                try {
                  await db.collection('users').doc(currentUserId).set({ isMember: true }, { merge: true });
                  alert("Payment successful! Your star is minted.");
                  document.getElementById('paymentModal')?.remove();
                  location.reload(); 
                } catch (err) { alert("Payment recorded! Refresh if needed."); }
              });
            },
            onError: function(err) { alert("Payment process failed. Please try again."); }
          }).render('#paypal-button-container');
        } catch(e) {
          paypalContainer.innerHTML = `<div style="color: #f87171; font-size: 0.8rem; text-align: center; padding: 8px;">Error loading PayPal.</div>`;
        }
      }

      if (!window.paypal) {
        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${CLIENT_ID}&currency=USD`;
        script.onload = () => renderPayPalButtons();
        script.onerror = () => {
          paypalContainer.innerHTML = `<div style="color: #f87171; font-size: 0.85rem; text-align: center; padding: 12px;">Failed to load PayPal. Disable adblocker.</div>`;
        };
        document.head.appendChild(script);
      } else {
        renderPayPalButtons();
      }
    }

    function scrollFilters(amount) { document.getElementById('filterBar').scrollBy({ left: amount, behavior: 'smooth' }); }
    function scrollPicker(amount) { document.getElementById('emotionPicker').scrollBy({ left: amount, behavior: 'smooth' }); }

    function setFilter(filterType, element) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderFeed();
    }

    function timeAgo(date) {
      if (!date) return 'just now';
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return `${Math.max(1, seconds)}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function listenToFeed() {
      const feedContainer = document.getElementById('feedContainer');
      if (unsubscribeFeed) unsubscribeFeed();

      unsubscribeFeed = db.collection('questions')
        .orderBy('createdAt', 'desc')
        .limit(100)
        .onSnapshot(async snapshot => {
          let fetchedItems = [];
          let authorIdsToFetch = new Set();

          snapshot.forEach(doc => {
            const item = doc.data();
            item.id = doc.id;
            fetchedItems.push(item);
            if (item.authorId) authorIdsToFetch.add(item.authorId);
          });

          for (let uId of authorIdsToFetch) {
            if (userMembershipsCache[uId] === undefined) {
              try {
                const uDoc = await db.collection('users').doc(uId).get();
                userMembershipsCache[uId] = (uDoc.exists && uDoc.data().isMember === true);
              } catch (e) {
                userMembershipsCache[uId] = false;
              }
            }
          }

          allQuestionsCache = fetchedItems;
          renderFeed(); 

          for (let item of fetchedItems) {
            db.collection('questions').doc(item.id).collection('answers')
              .where('authorId', '==', currentUserId)
              .get()
              .then(ansSnap => {
                if (!ansSnap.empty) userInteractedQuestionIds.add(item.id);
              })
              .catch(() => {});
          }
        }, err => {
          console.error("Feed error:", err);
          if (feedContainer) feedContainer.innerHTML = `<div class="empty-state">Unable to load thoughts. Please refresh.</div>`;
        });
    }

    function renderFeed() {
      const feedContainer = document.getElementById('feedContainer');
      if (!feedContainer) return;
      feedContainer.innerHTML = '';
      let visibleCount = 0;

      let sortedItems = [...allQuestionsCache].sort((a, b) => {
        const aMember = userMembershipsCache[a.authorId] ? 1 : 0;
        const bMember = userMembershipsCache[b.authorId] ? 1 : 0;
        if (aMember !== bMember) return bMember - aMember;

        let timeA = 0;
        if (a.createdAt) {
          timeA = typeof a.createdAt.toMillis === 'function' ? a.createdAt.toMillis() : (new Date(a.createdAt)).getTime();
        }
        let timeB = 0;
        if (b.createdAt) {
          timeB = typeof b.createdAt.toMillis === 'function' ? b.createdAt.toMillis() : (new Date(b.createdAt)).getTime();
        }
        return timeB - timeA;
      });

      sortedItems.forEach(item => {
        if (currentFilter === 'MyFeed' && item.authorId !== currentUserId && !userInteractedQuestionIds.has(item.id)) return;
        if (currentFilter !== 'All' && currentFilter !== 'MyFeed' && item.emotion !== currentFilter) return;

        visibleCount++;
        feedContainer.appendChild(createCardElement(item));
      });

      if (visibleCount === 0) {
        feedContainer.innerHTML = `<div class="empty-state">${currentFilter === 'MyFeed' ? "Your feed is empty. Release a thought or answer someone." : "No thoughts found in this space yet."}</div>`;
      }
    }

    function createCardElement(data) {
      const card = document.createElement('div');
      card.className = 'card';
      
      let dateObj = new Date();
      if (data.createdAt && typeof data.createdAt.toDate === 'function') {
        dateObj = data.createdAt.toDate();
      } else if (data.createdAt) {
        dateObj = new Date(data.createdAt);
      }

      const rawEmotion = data.emotion || 'Lost';
      const emotionClass = `badge-${rawEmotion.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
      const isOwner = data.authorId === currentUserId;
      const isMemberAuthor = (userMembershipsCache[data.authorId] === true);

      card.innerHTML = `
        <div class="card-header">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span class="badge ${emotionClass}">${escapeHtml(data.emotion || 'Thought')}</span>
            ${isMemberAuthor ? '<span style="font-size: 0.95rem; cursor: default;" title="Golden Member">⭐</span>' : ''}
          </div>
          <span class="card-time">${timeAgo(dateObj)}</span>
        </div>
        <div class="card-question">${escapeHtml(data.text)}</div>
        <div class="card-actions">
          <button class="btn-toggle-replies" onclick="toggleReplies('${data.id}')">💬 <span id="reply-count-${data.id}">${data.replyCount || 0}</span> answers</button>
          ${isOwner ? `<button class="btn-delete-card" onclick="handleDeleteQuestion('${data.id}')" title="Delete thought">🗑</button>` : ''}
        </div>
        <div class="replies-section" id="replies-${data.id}">
          <div class="replies-list" id="replies-list-${data.id}"><div style="font-size:0.75rem; color:var(--text-muted);">Loading...</div></div>
          <div class="reply-input-box">
            <input type="text" id="input-${data.id}" placeholder="Provide clarity or comfort..." maxlength="200" onkeydown="if(event.key==='Enter') submitReply('${data.id}')">
            <button class="btn-submit-reply" onclick="submitReply('${data.id}')">Answer</button>
          </div>
        </div>
      `;
      return card;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function handleDeleteQuestion(qId) {
      if (!confirm("Delete this thought?")) return;
      try { 
        const answersSnapshot = await db.collection('questions').doc(qId).collection('answers').get();
        const batch = db.batch();
        answersSnapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        await db.collection('questions').doc(qId).delete(); 
      } catch (err) { 
        console.error("Delete error:", err);
        alert("Failed to delete. Error: " + err.message); 
      }
    }

    async function handleDeleteReply(qId, ansId) {
      if (!confirm("Delete your answer?")) return;
      try {
        const qRef = db.collection('questions').doc(qId);
        await qRef.collection('answers').doc(ansId).delete();
        await qRef.update({ replyCount: firebase.firestore.FieldValue.increment(-1) });
        userInteractedQuestionIds.delete(qId);
        renderFeed();
      } catch (err) { 
        alert("Failed to delete answer. Error: " + err.message); 
      }
    }

    function toggleReplies(qId) {
      const section = document.getElementById(`replies-${qId}`);
      if (!section) return;

      if (section.classList.contains('open')) {
        section.classList.remove('open');
        if (activeReplyListeners[qId]) { 
          activeReplyListeners[qId](); 
          delete activeReplyListeners[qId]; 
        }
      } else {
        section.classList.add('open');
        loadReplies(qId);
      }
    }

    function loadReplies(qId) {
      const list = document.getElementById(`replies-list-${qId}`);
      if (!list) return;

      activeReplyListeners[qId] = db.collection('questions').doc(qId).collection('answers')
        .orderBy('createdAt', 'asc').onSnapshot(snap => {
          if (snap.empty) { 
            list.innerHTML = `<div style="font-size:0.75rem; color:var(--text-muted);">No answers yet.</div>`; 
            return; 
          }
          list.innerHTML = '';
          snap.forEach(doc => {
            const reply = doc.data();
            let dateObj = new Date();
            if (reply.createdAt && typeof reply.createdAt.toDate === 'function') {
              dateObj = reply.createdAt.toDate();
            }
            
            const isReplyMember = userMembershipsCache[reply.authorId] === true;
            
            const el = document.createElement('div');
            el.className = 'reply-bubble';
            el.innerHTML = `
              <div class="reply-content">
                <div>${isReplyMember ? '<span style="font-size: 0.85rem;" title="Golden Member">⭐</span> ' : ''}${escapeHtml(reply.text)}</div>
                <div class="reply-time">${timeAgo(dateObj)}</div>
              </div>
              ${reply.authorId === currentUserId ? `<button class="btn-delete-reply" onclick="handleDeleteReply('${qId}', '${doc.id}')">🗑</button>` : ''}
            `;
            list.appendChild(el);
          });
        });
    }

    // FIXED: Let the user know if their browser blocked the silent login
    async function handlePostQuestion() {
      const input = document.getElementById('questionInput');
      const text = input.value.trim();
      const emotion = document.querySelector('input[name="emotion"]:checked')?.value || 'Happy';
      const postBtn = document.getElementById('postBtn');

      if (!text) return;

      // Fail-safe check
      if (!currentUserId) {
        alert("Your connection to the cosmos was blocked! Try closing Incognito mode or allowing third-party cookies.");
        return;
      }

      postBtn.disabled = true; 
      postBtn.innerText = 'Releasing...';

      try {
        await db.collection('questions').add({
          text: text, 
          emotion: emotion, 
          authorId: currentUserId, 
          replyCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
      } catch (err) { 
        alert("Failed to submit. Error: " + err.message); 
      } finally { 
        postBtn.disabled = false; 
        postBtn.innerText = 'Release'; 
      }
    }

    async function submitReply(qId) {
      const input = document.getElementById(`input-${qId}`);
      const text = input.value.trim();
      if (!text) return;

      if (!currentUserId) {
        alert("Connection blocked by browser. Try a normal window!");
        return;
      }

      input.value = '';

      try {
        const qRef = db.collection('questions').doc(qId);
        await qRef.collection('answers').add({ 
          text: text, 
          authorId: currentUserId, 
          createdAt: firebase.firestore.FieldValue.serverTimestamp() 
        });
        // This is what failed earlier without the 'allow update' rule!
        await qRef.update({ replyCount: firebase.firestore.FieldValue.increment(1) });
        userInteractedQuestionIds.add(qId);
        renderFeed();
      } catch (err) { 
        console.error("Reply error:", err); 
        alert("Failed to answer. Error: " + err.message);
      }
    }
  </script>
